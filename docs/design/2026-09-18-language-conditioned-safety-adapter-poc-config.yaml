  inherited_v1_sections: [5, 6, 7, 8, 9, 12, 13, 14]
  status: proposed_not_executed
  execution_ready: false
  capabilities: [L1, L2, L3, L4, L5, L6]
  main_method: L0
  source_of_truth: protocol_document

