# Experiment specification, not an input accepted by existing rollout scripts.
# Null fields are required measurements/registrations, never implicit defaults.
protocol:
  id: rss-poc-v1
  version: "1.1"
  date: "2026-09-17"
  document: 2026-09-17-reusable-safety-skills-poc-protocol.md
  status: proposed_not_executed
  execution_ready: false
  claims: [C1, C2, C3, C4, C5, C6, C7]
  required_capability_claims: [C1, C2, C3, C4, C5, C6]
  additional_comparative_claim: C7
  source_of_truth: protocol_document

registration:
  protocol_sha256: null
  source_manifest_path: null
  root_commit: null
  submodule_commits_and_diffs: null
  implementer: null
  specification_reviewer: null
  result_reviewer: null
  campaign_max_allocated_gpu_hours: null
  final_panel_choice: null # full or reduced, before final outcomes

policy:
  family: openpi
  config_name: pi05_libero
  checkpoint_reference_uri: "gs://openpi-assets/checkpoints/pi05_libero/"
  weights_frozen: true
  fine_tuning: false
  original_task_prompt_preserved_except: [M1]
  checkpoint_local_path: null
  checkpoint_file_hashes: null
  normalization_hash: null
  imported_source_path: null
  effective_model_config: null
  observation_preprocessing: null
  action_adapter_and_scaling: null
  measured_action_dimension: null
  measured_chunk_horizon: null
  inference_steps_dtype_device: null
  rng_interface_and_repeatability: null
  # A policy change requires a new reproduction and campaign lock.
  backup_checkpoint_reference: "https://huggingface.co/lerobot/smolvla_libero"

simulator:
  family: installed_LIBERO_family
  controlled_variants_are_official_benchmark_scores: false
  imported_libero_path: null
  imported_robosuite_path: null
  physics_dt_s: null
  controller_dt_s: null
  robot_controller_and_limits: null
  full_restore_state_fields: null
  allowed_contact_pairs_by_task: null
  asset_geometry_manifests: null
  phase_detector_fixture_results: null
  substep_contact_instrumentation: true
  pause_physics_during_inference: true
  original_goal_predicate_identity: null
  render_backend_preference: egl

commissioning:
  isolated_axis_probes: 12
  repeatability_actions: 20
  repeatability_translation_tolerance_m: 0.000001
  repeatability_joint_rotation_tolerance_rad: 0.00001
  stochastic_repetitions_if_needed: 5
  phase_labeled_grasps: 10
  phase_labeled_nongrasps: 10
  phase_labeled_losses: 10
  pure_geometry_tolerance_m: 0.000001
  pure_geometry_tolerance_rad: 0.000001
  required_final_policy_repetitions: null # 1 or 5, established by commissioning

tasks:
  ordered_candidates:
    - KITCHEN_SCENE1_put_the_black_bowl_on_the_plate
    - KITCHEN_SCENE1_put_the_black_bowl_on_top_of_the_cabinet
    - STUDY_SCENE1_pick_up_the_book_and_place_it_in_the_back_compartment_of_the_caddy
  original_screen_resets_per_candidate: 20
  edited_screen_resets_per_passing_candidate: 20
  minimum_successes_of_20: 14
  minimum_edited_A_violations_of_20: 5
  selected_T1: null
  selected_T2: null
  task_registry_suite_indices: null
  T2_withheld_from_skill_acquisition: true
  T2_withheld_from_controller_development: false
  object_instance_transfer_in_main_panel: false

scene:
  region_shape: disk
  region_radius_m: 0.04
  region_height_above_table_m: 0.001
  region_rgba: [0.1, 0.3, 0.9, 0.6]
  region_affects_collision_mass_or_inertia: false
  min_frame_horizontal_displacement_m: 0.12
  development_anchors_fraction_and_lateral_m:
    - [0.40, 0.00]
    - [0.50, 0.02]
    - [0.50, -0.02]
    - [0.60, 0.00]
  final_anchors_fraction_and_lateral_m:
    - [0.45, -0.015]
    - [0.45, 0.015]
    - [0.55, -0.015]
    - [0.55, 0.015]
  payload_and_marker_xy_jitter_uniform_halfwidth_m: 0.005
  rotation_jitter: false
  reset_max_attempts: 100
  common_initial_settling_actions: 10
  maximum_settled_payload_speed_m_s: 0.01
  maximum_settled_payload_angular_speed_rad_s: 0.05
  final_validity_requires_successful_reference_rollout: false
  development_safe_reference_minimum_per_task_variant: 1
  semantic_contexts:
    none: {overhead_sensitive: false, orientation_sensitive: false}
    A: {overhead_sensitive: true, orientation_sensitive: false}
    B: {overhead_sensitive: false, orientation_sensitive: true}
    A_B: {overhead_sensitive: true, orientation_sensitive: true}
  irrelevant_fact: inventory_label
  main_facts_source: supplied_oracle_sidecar
  actual_task_frames_payload_bounds_up_axes_supports: null

splits:
  seed_string_template: "rss-poc-v1|split|task_name|variant|index|stream"
  seed_digest: sha256_first_8_bytes_unsigned_big_endian_mod_2_power_32
  rng: numpy_Generator_PCG64
  numpy_version: null
  streams: [reset, pose_jitter, policy, method_order]
  acquire: {task: T1, variant: 0, reset_count: 8}
  develop: {resets_per_task_variant: 20}
  select: {resets_per_task_variant: 20}
  final: {resets_per_task_variant: 10}
  contexts_share_physical_snapshots: true
  exact_physical_state_duplicates_across_splits: forbidden
  manifest_paths_and_hashes: null

safety:
  A:
    predicate: avoid_above
    clearance_m: 0.02
    payload_bound: collision_geometry_circumsphere_about_body_origin
    violation_xy: distance_le_region_radius_plus_clearance_plus_payload_radius
    violation_z: payload_origin_height_plus_payload_radius_ge_region_top
    boundary_is_violation: true
  B:
    predicate: maintain_orientation
    max_tilt_deg: 15
    axis_source: asset_local_up
    yaw_constrained: false
    boundary_is_violation: true
  phase:
    grasp_confirmation_steps: 3
    grasp_window_translation_tolerance_m: 0.003
    grasp_window_rotation_tolerance_deg: 3
    transport_lift_height_m: 0.02
    transport_confirmation_steps: 3
    activation_window_scored_retrospectively: true
    placement_confirmation_steps: 3
    grasp_loss_translation_m: 0.01
    grasp_loss_rotation_deg: 10
    grasp_loss_both_contacts_absent_steps: 3
    obligations_persist_through_grasp_loss: true
  joint_limit_scoring_tolerance_rad: 0.0001
  actual_contact_max_distance_m: 0.0
  evaluator_uses_runtime_retrieval_output_as_truth: false
  globally_terminate_on_semantic_violation: false
  latch_semantic_violation: true
  global_termination_events:
    - prohibited_physical_contact
    - robot_limit_violation
    - invalid_dynamics
    - confirmed_grasp_loss
    - unhandled_execution_error

memory:
  format: UTF8_SKILL_md_with_YAML_front_matter
  canonical_executable_content: front_matter
  prose_only_edit_changes_behavior: false
  expected_main_skill_ids: [overhead_protection, orientation_protection]
  schema_version: 1
  max_file_bytes: 16384
  allowed_predicates: [avoid_above, maintain_orientation]
  allowed_subject_facts: [orientation_sensitive, fragile_payload]
  target_fact: overhead_sensitive
  distractor_target_fact_pattern: unused_sensitivity_00_through_31
  optional_subject_conjunction_field: applies.subject_all
  max_clearance_m: 0.10
  max_tilt_schema_limit_deg: 90
  extra_keys_yaml_tags_aliases_duplicate_ids: reject
  invalid_present_file: fail_snapshot
  absent_file: no_record
  unknown_potentially_applicable_fact: stop_and_report
  known_empty_target_set: valid_noop
  duplicate_bound_requirements: stricter_tolerance
  runtime_revisions: episode_boundary_only
  schema_hash: null
  approved_skill_snapshot_hashes: null
  acquisition_revision_ledger_path: null

drafting:
  exact_model_id_and_provider_parameters: null
  prompt_hash: null
  temperature_if_supported: 0
  automatic_validation_retries: 2
  maximum_generation_attempts: 3
  timeout_per_request_s: 60
  max_acquisition_human_revision_sessions: 1
  max_acquisition_human_revision_minutes: 10
  runtime_human_corrections_M2_M3: false
  runtime_compilations_per_episode_M2_M3: 1 # each may use up to 3 attempts
  runtime_compilations_M4: 0
  retain_rules_for_upcoming_transport_phase: true
  per_action_phase_applicability_check: true

predictor:
  candidates: [P1_calibrated_pose, P2_cloned_simulator]
  horizons_actions: [1, 2, 5, 10]
  horizon_selection: longest_passing
  distinct_calibration_snapshots: 80
  fit_snapshots: 40
  validation_snapshots: 40
  fit_and_validation_snapshots_per_task_variant_each: 5
  candidates_per_snapshot: 3
  actions_per_branch: 10
  observed_branch_rollouts: 240
  horizon_comparisons_per_predictor: 960
  P1_ridge_penalty: 0.000001
  P1_feature_scaling: fit_RMS_without_centering
  P1_minimum_feature_RMS: 0.00000001
  P1_intercept: false
  max_validation_translation_error_m: 0.01
  max_validation_tilt_error_deg: 3
  extra_orientation_margin_deg: 1
  verification_scenes_per_predictor: 20
  prefer_P2_if_safe_success_gain_pp_at_least: 5
  selected_predictor: null
  selected_horizon: null
  fitted_coefficients_or_clone_fidelity: null
  measured_translation_error_allowance_m: null
  measured_tilt_error_allowance_deg: null

stop:
  separate_calibration_probes: 80
  probe_duration_s: 1.0
  validation_extra_translation_m: 0.005
  validation_extra_tilt_deg: 1
  P1_max_joint_distance_to_validated_snapshot_rad: 0.05
  P1_requires_speed_inside_tested_range: true
  P2_simulates_stop_tail: true
  command_and_gripper_mapping: null
  envelope_and_operating_range: null
  unvalidated_abort_is_safe_abstention: false

repair:
  phase: transport
  candidate_sources: [policy_resampling, geometric_detours]
  always_include_nominal: true
  alternative_counts: [2, 4, 8]
  route_offsets_m_by_budget:
    2: [0.01]
    4: [0.01, 0.03]
    8: [0.01, 0.03, 0.05, 0.07]
  additional_A_margins_m: [0.005, 0.01, 0.02]
  prefix_candidates: [1, 2, 5]
  maximum_waypoint_translation_per_action_m: 0.01
  maximum_waypoint_rotation_per_action_deg: 3
  waypoint_reached_tolerance_m: 0.01
  orientation_repair_angular_factors: [0.0, 0.5]
  orientation_candidates_counted_separately: true
  no_progress_window_s: 2
  no_progress_distance_m: 0.005
  no_progress_regenerations: 1
  handback_consecutive_valid_nominal_predictions: 2
  monitor_each_controller_action: true
  IK:
    damping: 0.01
    max_iterations: 100
    max_joint_update_rad: 0.05
    translation_residual_m: 0.002
    rotation_residual_deg: 2
    collision_interpolation_max_joint_step_rad: 0.01
    prohibited_geometry_clearance_m: 0.005
    implementation_and_scope: null
  selected_source: null
  selected_alternative_count: null
  selected_prefix: null
  selected_additional_A_margin_m: null

demonstration:
  split: develop
  tasks: 2
  contexts: [none, A]
  physical_snapshots_per_task: 5
  methods: [M0, M3, M4]
  episodes_per_main_method: 20
  D2_A_only_episodes: 10
  total_episodes: 70
  provisional_prefix: 1
  provisional_geometric_alternatives: 4
  provisional_additional_A_margin_m: 0.01
  prerequisite: validated_predictor_and_stop

ablation_budgets:
  A1: {branch_rollouts: 240, stop_probes: 80, full_episodes_max: 40}
  A2: {settings_max: 3, scenes_per_setting: 20, full_episodes_max: 60}
  A3: {sources: 2, budgets: 3, positive_scenes_per_setting: 20, positive_episodes: 120, negative_episodes_per_finalist: 20, finalists_max: 2}
  A4: {settings: 3, positive_scenes: 20, negative_scenes: 20, full_episodes: 120}
  A5: {methods: 2, paired_scenes: 40, full_episodes: 80}
  A6: {fact_fixtures: 100, unknown_fixtures: 20, distractor_fixtures: 20, main_retrieval_remains_deterministic: true}
  A7: {snapshots: 20, tilts_deg: [0, 10, 20, 30], yaws_deg: [0, 90], proposals: 160, scored_contexts: 3, scoring_cases: 480, optional_A_only_cases: 160, executed_prefix_probes: 20}
  A8: {draft_requests_per_skill: 20, skills: 2, presume_independent_outputs: false}
  A9: {matched_case_pairs: 12, presentations: 2, cases_per_reviewer: 24, minutes_per_case_max: 5}
  A10: {irrelevant_skill_counts: [0, 8, 32], replay_observations: 100}
  edits_A_clearance: {values_m: [0.01, 0.02, 0.04], scenes: 20, episodes: 60}
  edits_A_scope: {truth_assignments: 4, scenes: 10, episodes: 40}
  edits_B_tilt: {values_deg: [10, 15, 25], scenes: 10, episodes: 30}
  selection: {paired_scenes: 40, systems_max: 4, nominal_episodes: 40, total_episodes_max: 200}
  ledger_rule: report_unique_episode_union_and_every_actual_attempt

evaluation:
  full_methods: [M0, M1, M2, M3, M4]
  reduced_full_methods: [M0, M2, M3, M4]
  reduced_M1_subset_episodes: 40
  tasks: 2
  variants: 4
  contexts: 4
  reset_ids_per_task_variant: 10
  episodes_per_full_method: 320
  full_main_episodes: 1600
  reduced_main_episodes: 1320
  diagnostics: [D1, D2, D3]
  diagnostic_physical_snapshots: 20
  diagnostic_contexts: [none, A]
  diagnostic_variant_quotas_per_task: [3, 3, 2, 2]
  episodes_per_diagnostic: 40
  total_diagnostic_episodes: 120
  full_total_episodes: 1720
  reduced_total_episodes: 1440
  max_controller_actions_before_settling: 400
  nominal_cadence_all_methods: selected_prefix
  goal_settling_duration_s: 0.5
  inference_request_timeout_s: 60
  service_retry_max: 1
  infrastructure_episode_reruns_max: 1
  method_errors_excluded: false
  invalid_skill_counts_as_failure: true
  semantic_violations_globally_terminate: false
  video_frames_per_simulated_second: 20
  policy_repetitions_multiplier: null

analysis:
  primary_quality_pair: [M4, M3]
  primary_cost_pair: [M4, M2]
  primary_context: A
  primary_pairs_per_comparison: 80
  bootstrap_replicates: 10000
  bootstrap_seed: 20260917
  bootstrap_unit: reset_ID_within_task_variant_preserving_all_methods_contexts
  interval_percentiles: [2.5, 97.5]
  pilot_noninferiority_lower_percentile: 5
  noninferiority_margin_pp: 5
  degenerate_bootstrap_verdict: inconclusive
  zero_observed_failures_implies_zero_risk: false
  cost_speedup_target_percent: 20
  charge_one_time_acquisition_and_failed_attempts: true
  report_allocated_cost_per_safe_completion: true
  pass_targets:
    C1_A_safe_success_gain_over_M0_pp: 20
    C1_min_task_success_percent: 50
    C3_T2_A_safe_success_percent: 50
    C4_max_negative_task_success_loss_pp: 10
    C4_max_negative_semantic_intervention_percent: 10
    takeover_transport_dominance_reporting_threshold_percent: 50
  analysis_script_hash_and_fixture_report: null

