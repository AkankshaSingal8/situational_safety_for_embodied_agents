<g class="component" data-node="loss" role="button" tabindex="0" aria-label="Flow-matching loss: show component details"><title>Flow-matching loss</title><rect class="node-surface" x="1220" y="752" width="330" height="144" rx="13" fill="#f3edfb" stroke="#7951aa" stroke-width="1.4"/>
<text x="1240" y="780" font-family="DejaVu Sans, sans-serif" font-size="12" font-weight="650" fill="#7951aa" letter-spacing="1.15" >SUPERVISED OBJECTIVE</text>
<text x="1240" y="812" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="650" fill="#24352f" letter-spacing="0" >Flow-matching loss</text>
<text x="1240" y="842" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#52675d" letter-spacing="0" >MSE(v_prediction, ε − A*)</text>
<text x="1240" y="867" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#52675d" letter-spacing="0" >+ null-context residual penalty</text>
