<g class="component" data-node="prediction" role="button" tabindex="0" aria-label="Predicted velocity: show component details"><title>Predicted velocity</title><rect class="node-surface" x="1220" y="444" width="330" height="167" rx="13" fill="#f3edfb" stroke="#7951aa" stroke-width="1.4"/>
