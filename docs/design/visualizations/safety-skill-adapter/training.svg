<g class="component" data-node="optimizer" role="button" tabindex="0" aria-label="Update adapter φ: show component details"><title>Update adapter φ</title><rect class="node-surface" x="810" y="752" width="340" height="144" rx="13" fill="#f3edfb" stroke="#7951aa" stroke-width="1.4"/>
