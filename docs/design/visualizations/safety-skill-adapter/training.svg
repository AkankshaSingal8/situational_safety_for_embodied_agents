<text x="68" y="504" font-family="DejaVu Sans, sans-serif" font-size="22.5" font-weight="650" fill="#24352f" letter-spacing="0" >Sample noise + time</text>
<text x="68" y="534" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#52675d" letter-spacing="0" >x_t = t ε + (1 − t) A*</text>
<text x="68" y="559" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" fill="#52675d" letter-spacing="0" >t = 1 is noise; t = 0 is data</text>
