<g class="component" data-node="noise" role="button" tabindex="0" aria-label="Sample noise + time: show component details"><title>Sample noise + time</title><rect class="node-surface" x="48" y="444" width="302" height="167" rx="13" fill="#f5f5f2" stroke="#68726c" stroke-width="1.4"/>
