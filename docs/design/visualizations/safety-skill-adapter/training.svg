<text x="48" y="1013" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#66736b" letter-spacing="0" >Dashed purple arrows denote optimizer updates. Other arrows denote data. Targets and budgets are proposed, not measured.</text>
