<text x="49" y="958" font-family="DejaVu Sans, sans-serif" font-size="19" font-weight="400" fill="#59675d" letter-spacing="0" >No gradient updates to skill files, the text encoder, or pretrained π0.5. No online training during final evaluation.</text>
