<g class="component" data-node="split" role="button" tabindex="0" aria-label="Reserve transfer tests: show component details"><title>Reserve transfer tests</title><rect class="node-surface" x="1220" y="184" width="330" height="140" rx="13" fill="#f5f5f2" stroke="#68726c" stroke-width="1.4"/>
