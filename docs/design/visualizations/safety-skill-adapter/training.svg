<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" width="1600" height="1040" role="img" aria-labelledby="training-title training-description">
<title id="training-title">Learn the skill-to-action interface offline.</title>
<desc id="training-description">Checked demonstrations provide targets; gradients update the shared adapter only. Proposed architecture, not experimental results. Click or focus components in the interactive HTML for details.</desc>
