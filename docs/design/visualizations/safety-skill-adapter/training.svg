<g class="component" data-node="trainadapter" role="button" tabindex="0" aria-label="Shared flow adapter: show component details"><title>Shared flow adapter</title><rect class="node-surface" x="810" y="444" width="340" height="167" rx="13" fill="#f3edfb" stroke="#7951aa" stroke-width="1.4"/>
