# Activation contract for `fragile_speed_limit`.
#
# Each case is a scene plus the activation this record must produce on it. The
# runner (tests/test_rule_contracts.py) lifts the record over the scene, then
# evaluates the resulting rules -- so a case exercises binding AND the formula,
# not just one of them.
#
# `expect: fires` means at least one lifted rule evaluates true;
# `expect: silent` means none does. `expect_fired` pins the exact count where
# the count is the point. A boundary case sits deliberately within a
# millimetre of the threshold, so a sign error or an off-by-one comparison
# shows up here rather than in an episode.
schema_version: 1
cases:
  # Positive: fragile object within 0.15 m.
  - name: near_fragile_fires
    expect: fires
    expect_fired: 1
    scene:
      eef_pos: [0.10, 0.0, 0.85]
      objects:
        glass_cup: {pos: [0.0, 0.0, 0.85], facts: {IS_FRAGILE: true}}

  # Negative: within range, but not fragile -> not even selected as a target.
  - name: near_sturdy_object_is_silent
    expect: silent
    expect_resolved: 0
    scene:
      eef_pos: [0.10, 0.0, 0.85]
      objects:
        book: {pos: [0.0, 0.0, 0.85], facts: {IS_FRAGILE: false}}

  # Negative: fragile, but outside the radius. Binds, does not fire.
  - name: far_from_fragile_is_silent
    expect: silent
    expect_resolved: 1
    scene:
      eef_pos: [0.40, 0.0, 0.85]
      objects:
        glass_cup: {pos: [0.0, 0.0, 0.85], facts: {IS_FRAGILE: true}}

  # Negative: unknown fact is not a false one, and is not selected either.
  - name: unknown_fragility_is_not_selected
    expect: silent
    expect_resolved: 0
    expect_unknown: [mystery_jar]
    scene:
      eef_pos: [0.10, 0.0, 0.85]
      objects:
        mystery_jar: {pos: [0.0, 0.0, 0.85], facts: {IS_FRAGILE: null}}

  # Negative, and the case that pins revision 2's `AND NOT HOLDING(TARGET)`:
  # the payload is fragile and is being held, so the end-effector is 0 m from
  # it. Without the clause this fires on every fragile payload, capping the
  # approach speed toward an object that cannot be approached. If this case
  # ever reports `fires`, the clause has been dropped.
  - name: held_fragile_payload_is_silent
    expect: silent
    expect_resolved: 1
    scene:
      eef_pos: [0.0, 0.0, 0.95]
      grasped: glass_cup
      objects:
        glass_cup: {pos: [0.0, 0.0, 0.95], facts: {IS_FRAGILE: true}}

  # ...and the same payload, set down on the table and released, DOES fire:
  # HOLDING requires the object to be lifted clear, so putting it down
  # restores the rule rather than disabling it permanently.
  - name: released_fragile_payload_fires
    expect: fires
    expect_fired: 1
    scene:
      eef_pos: [0.10, 0.0, 0.82]
      objects:
        glass_cup: {pos: [0.0, 0.0, 0.82], facts: {IS_FRAGILE: true}}

  # Boundary: 1 mm either side of 0.15 m.
  - name: boundary_just_inside_radius
    expect: fires
    scene:
      eef_pos: [0.149, 0.0, 0.85]
      objects:
        glass_cup: {pos: [0.0, 0.0, 0.85], facts: {IS_FRAGILE: true}}
  - name: boundary_just_outside_radius
    expect: silent
    scene:
      eef_pos: [0.151, 0.0, 0.85]
      objects:
        glass_cup: {pos: [0.0, 0.0, 0.85], facts: {IS_FRAGILE: true}}
